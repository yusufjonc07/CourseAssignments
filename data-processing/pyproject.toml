[tool.poetry]
name = "np-learning"
version = "0.1.0"
description = "NumPyStudy"
authors = ["Yusufjon <yusupeu.dev@gmail.com>"] 
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.3.4"
notebook = "^7.4.7"
pandas = "^2.3.3"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"
statsmodels = "^0.14.5"
nbconvert = {extras = ["webpdf"], version = "^7.16.6"}
lxml = "^6.0.2"
beautifulsoup4 = "^4.14.2"
html5lib = "^1.1"
openpyxl = "^3.1.5"
xlrd = "^2.0.2"
psutil = "^7.1.2"
kagglehub = "^0.3.13"
tk = "^0.1.0"


[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.0.1,<8.0.0)"
]
