[tool.poetry]
name = "np-learning"
version = "0.1.0"
description = "NumPyStudy"
authors = ["Yusufjon <yusupeu.dev@gmail.com>"] 
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.3.4"
notebook = "^7.4.7"
pandas = "^2.3.3"
matplotlib = "^3.10.7"


[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.0.1,<8.0.0)"
]
